<style>
  :root{
    --bg:#0B0E1A;
    --bg-elev:#12162A;
    --card:#161B32;
    --card-hover:#1C2140;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --text:#E9EBF8;
    --text-dim:#9BA3C9;
    --text-faint:#6B7299;
    --violet:#7C6CF6;
    --violet-soft:rgba(124,108,246,0.16);
    --teal:#2DD9C7;
    --teal-soft:rgba(45,217,199,0.16);
    --blue:#5B93F7;
    --blue-soft:rgba(91,147,247,0.16);
    --coral:#FF6B7A;
    --coral-soft:rgba(255,107,122,0.16);
    --amber:#FFB454;
    --amber-soft:rgba(255,180,84,0.16);
    --green:#4ADE9E;
    --green-soft:rgba(74,222,158,0.16);
    --shadow-sm:0 2px 8px rgba(0,0,0,0.25);
    --shadow-md:0 8px 24px rgba(0,0,0,0.35);
    --shadow-glow:0 0 0 1px rgba(124,108,246,0.25), 0 8px 30px rgba(124,108,246,0.15);
    --radius:16px;
    --radius-sm:10px;
  }
  [data-theme="light"]{
    --bg:#F3F5FC;
    --bg-elev:#EAEDF9;
    --card:#FFFFFF;
    --card-hover:#F7F8FE;
    --border:rgba(30,35,70,0.08);
    --border-strong:rgba(30,35,70,0.14);
    --text:#1A1D33;
    --text-dim:#5A6088;
    --text-faint:#8A90B5;
    --shadow-sm:0 2px 8px rgba(30,35,70,0.06);
    --shadow-md:0 8px 24px rgba(30,35,70,0.10);
    --shadow-glow:0 0 0 1px rgba(124,108,246,0.18), 0 8px 30px rgba(124,108,246,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--violet-soft), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, var(--teal-soft), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    transition:background .4s ease, color .3s ease;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--violet);color:white;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}

  .app-shell{max-width:1180px;margin:0 auto;padding:20px 24px 80px;}
  @media (max-width:640px){.app-shell{padding:14px 14px 70px;}}

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px 4px 22px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    position:relative;width:38px;height:38px;flex:none;
  }
  .brand-mark svg{display:block;width:100%;height:100%;}
  .brand-mark .orbit-ring{
    transform-origin:100px 100px;
    animation:spin 8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .brand-text .name{font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1;}
  .brand-text .tag{font-size:11.5px;color:var(--text-faint);letter-spacing:.3px;margin-top:3px;}

  .top-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
    background:var(--card);color:var(--text-dim);display:flex;align-items:center;justify-content:center;
    transition:all .18s ease;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong);background:var(--card-hover);transform:translateY(-1px);}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border:none;border-radius:11px;
    padding:10px 16px;font-size:13.5px;font-weight:600;transition:all .18s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--violet),#9C7CF6);
    color:white;box-shadow:0 4px 16px rgba(124,108,246,0.35);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,108,246,0.45);}
  .btn-ghost{background:var(--card);color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--border-strong);}
  .btn-danger{background:var(--coral-soft);color:var(--coral);}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}

  /* ---------- NAV TABS ---------- */
  .nav-tabs{display:flex;gap:6px;background:var(--bg-elev);padding:5px;border-radius:13px;border:1px solid var(--border);width:fit-content;margin:0 0 26px;}
  .nav-tab{
    padding:9px 16px;border:none;background:transparent;color:var(--text-faint);
    font-size:13.5px;font-weight:600;border-radius:9px;transition:all .2s ease;
    display:flex;align-items:center;gap:7px;
  }
  .nav-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm);}
  .nav-tab:not(.active):hover{color:var(--text-dim);}
  @media (max-width:640px){.nav-tabs{width:100%;overflow-x:auto;}.nav-tab{white-space:nowrap;}}

  /* ---------- DASHBOARD ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.stat-grid{grid-template-columns:1fr;}}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
  }
  .stat-card::after{
    content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;
    background:var(--accent-soft,var(--violet-soft));filter:blur(6px);
  }
  .stat-label{font-size:12px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .stat-value{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin-top:6px;}
  .stat-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

  .section-title{
    display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;
  }
  .section-title h2{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;}
  .section-title .count{color:var(--text-faint);font-weight:500;font-size:13px;margin-left:8px;}

  .empty-state{
    border:1.5px dashed var(--border-strong);border-radius:var(--radius);
    padding:34px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;
  }
  .empty-state b{color:var(--text-dim);}

  .deadline-list{display:flex;flex-direction:column;gap:8px;}
  .deadline-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:11px 14px;transition:all .18s ease;
  }
  .deadline-row:hover{border-color:var(--border-strong);background:var(--card-hover);}
  .prio-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .deadline-title{flex:1;font-size:13.5px;font-weight:500;}
  .deadline-goal{font-size:11.5px;color:var(--text-faint);}
  .deadline-date{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;}

  /* ---------- GOALS VIEW ---------- */
  .goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .goal-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow-sm);transition:all .2s ease;
  }
  .goal-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);}
  .goal-top{display:flex;gap:14px;align-items:center;}
  .goal-info{flex:1;min-width:0;}
  .goal-title{font-size:15.5px;font-weight:600;margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .goal-meta{font-size:12px;color:var(--text-faint);}
  .goal-actions{display:flex;gap:6px;}
  .goal-body{margin-top:14px;}
  .goal-tasklist{margin-top:12px;display:flex;flex-direction:column;gap:7px;max-height:280px;overflow-y:auto;padding-right:2px;}
  .add-task-inline{
    display:flex;gap:8px;margin-top:10px;
  }
  .add-task-inline input{flex:1;}

  .metric-section{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:14px;
  }
  .metric-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .metric-name{font-size:12.5px;font-weight:700;color:var(--text);}
  .metric-target{font-size:11px;color:var(--text-faint);}
  .metric-quickadd{display:flex;gap:7px;margin-top:10px;}
  .metric-quickadd input[type="date"]{flex:1.3;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--text);font-size:12px;min-width:0;}
  .metric-quickadd input[type="number"]{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--text);font-size:12px;min-width:0;}
  .metric-log-list{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
  .metric-log-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);padding:3px 0;}
  .metric-log-date{color:var(--text-faint);flex:none;}
  .metric-log-value{font-weight:600;color:var(--text);flex:1;}

  .task-row{
    display:flex;align-items:center;gap:10px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:10px;padding:9px 10px;transition:all .18s ease;
  }
  .task-row.done{opacity:.55;}
  .task-check{
    width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border-strong);flex:none;
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;background:transparent;
  }
  .task-check.checked{background:linear-gradient(135deg,var(--teal),var(--green));border-color:transparent;}
  .task-check.progress{border-color:var(--blue);}
  .task-check-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);}
  .task-title{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task-row.done .task-title{text-decoration:line-through;}
  .prio-pill{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.3px;flex:none;}
  .due-pill{font-size:10.5px;color:var(--text-faint);flex:none;}
  .task-del{background:transparent;border:none;color:var(--text-faint);padding:2px;flex:none;border-radius:6px;}
  .task-del:hover{color:var(--coral);}

  @keyframes popCheck{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}
  .task-check.checked{animation:popCheck .35s ease;}
  @keyframes strikeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
  .task-row{animation:strikeIn .25s ease;}

  /* ---------- KANBAN ---------- */
  .kanban-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  @media (max-width:800px){.kanban-wrap{grid-template-columns:1fr;}}
  .kanban-col{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;min-height:120px;transition:background .15s ease;
  }
  .kanban-col.drag-over{background:var(--violet-soft);}
  .kanban-col-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px;}
  .kanban-col-dot{width:8px;height:8px;border-radius:50%;}
  .kanban-col-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);}
  .kanban-col-count{margin-left:auto;font-size:11.5px;color:var(--text-faint);background:var(--card);border-radius:20px;padding:2px 8px;}
  .kanban-cards{display:flex;flex-direction:column;gap:9px;min-height:60px;}
  .kanban-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;
    cursor:grab;box-shadow:var(--shadow-sm);transition:all .18s ease;
  }
  .kanban-card:hover{border-color:var(--border-strong);transform:translateY(-1px);}
  .kanban-card:active{cursor:grabbing;}
  .kanban-card-goal{font-size:10.5px;font-weight:700;letter-spacing:.3px;margin-bottom:6px;display:inline-flex;align-items:center;gap:5px;}
  .kanban-card-title{font-size:13px;font-weight:500;margin-bottom:8px;line-height:1.35;}
  .kanban-card-foot{display:flex;align-items:center;justify-content:space-between;}

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,8,18,0.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--card);border:1px solid var(--border-strong);border-radius:18px;
    width:100%;max-width:420px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal h3{margin:0 0 16px;font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .field input[type="text"],.field input[type="date"],.field select,.field textarea{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;
    padding:10px 11px;color:var(--text);font-size:13.5px;transition:border-color .15s ease;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);outline:none;}
  .swatches{display:flex;gap:8px;}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:all .15s ease;}
  .swatch.selected{border-color:var(--text);transform:scale(1.1);}
  .metric-toggle-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-dim);cursor:pointer;padding:2px 0;}
  .metric-toggle-row input[type="checkbox"]{accent-color:var(--violet);width:16px;height:16px;flex:none;}
  .prio-choice{display:flex;gap:8px;}
  .prio-btn{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elev);font-size:12.5px;font-weight:600;color:var(--text-dim);}
  .prio-btn.selected{color:white;border-color:transparent;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* ---------- PROGRESS RING ---------- */
  .ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:none;}
  .ring-wrap span{position:absolute;font-family:'Space Grotesk',sans-serif;font-weight:700;}

  .fade-view{animation:fadeUp .28s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .footer-note{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:50px;}

  /* ---------- CALENDAR VIEW ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 16px;}
  .cal-month-label{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;text-transform:capitalize;}
  .orbit-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .orbit-cal-dow{font-size:11px;color:var(--text-faint);text-align:center;padding-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .orbit-cal-cell{
    aspect-ratio:1;border-radius:11px;border:1px solid var(--border);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
    transition:all .15s ease;padding:4px;
  }
  .orbit-cal-cell:hover{border-color:var(--border-strong);}
  .orbit-cal-cell.other-month{opacity:.35;}
  .orbit-cal-cell.today{border-color:var(--violet);}
  .orbit-cal-cell.selected{background:var(--violet);border-color:var(--violet);}
  .orbit-cal-cell.selected .orbit-cal-daynum{color:white;}
  .orbit-cal-daynum{font-size:12.5px;font-weight:600;}
  .orbit-cal-bars{display:flex;gap:3px;align-items:center;height:6px;}
  .orbit-cal-bar{width:6px;height:6px;border-radius:50%;}
  .orbit-cal-more{font-size:9px;color:var(--text-faint);}
  .orbit-cal-cell.selected .orbit-cal-more{color:rgba(255,255,255,0.8);}
  @media (max-width:640px){.orbit-cal-daynum{font-size:11px;}}

  /* ---------- STATS VIEW ---------- */
  .stats-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .stats-period-tabs{display:flex;gap:5px;background:var(--bg-elev);padding:4px;border-radius:11px;border:1px solid var(--border);}
  .stats-period-btn{padding:7px 14px;border:none;background:transparent;color:var(--text-faint);font-size:12.5px;font-weight:600;border-radius:8px;transition:all .15s ease;}
  .stats-period-btn.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm);}
  .stats-nav{display:flex;align-items:center;gap:8px;}
  .stats-range-label{font-size:13px;font-weight:600;color:var(--text-dim);min-width:130px;text-align:center;text-transform:capitalize;}
  .card-like-chart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px 6px;box-shadow:var(--shadow-sm);}
  .stats-chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .stats-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px;}
  .stats-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px;min-width:14px;}
  .stats-bar-val{font-size:9px;color:var(--text-faint);}
  .stats-bar-track{width:100%;max-width:20px;height:100%;display:flex;align-items:flex-end;background:var(--bg-elev);border-radius:5px 5px 0 0;overflow:hidden;}
  .stats-bar-fill{width:100%;border-radius:5px 5px 0 0;transition:height .3s ease;min-height:2px;}
  .stats-bar-label{font-size:9.5px;color:var(--text-faint);white-space:nowrap;}
  .stats-goal-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .stats-goal-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .stats-goal-name{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stats-goal-metric{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .stats-goal-count{font-size:12px;color:var(--text-faint);white-space:nowrap;}

  /* ---------- task subpanels (subtasks / notes) ---------- */
  .task-subpanel{margin:6px 0 4px 29px;padding:10px 12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:11px;}
  .subtask-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;}
  .subtask-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
  .subtask-check.checked{background:linear-gradient(135deg,var(--teal),var(--green));border-color:transparent;}
  .subtask-text{flex:1;}
  .subtask-text.done{text-decoration:line-through;color:var(--text-faint);}
  .subtask-add-row{display:flex;gap:6px;margin-top:6px;}
  .subtask-add-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--text);}
  .task-note-area textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:12.5px;color:var(--text);font-family:inherit;resize:vertical;min-height:56px;}
  .task-badge-mini{font-size:10px;color:var(--text-faint);background:var(--card);border:1px solid var(--border);padding:2px 7px;border-radius:7px;flex:none;white-space:nowrap;}

  /* ---------- recurring day picker (reused for task modal) ---------- */
  .day-picker{display:flex;gap:6px;margin:2px 0 2px;}
  .day-chip{flex:1;text-align:center;padding:8px 0;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elev);color:var(--text-dim);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .day-chip.active{background:var(--violet);color:white;border-color:var(--violet);}

  /* ---------- archived goals & backup ---------- */
  .backup-actions{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- quick-add FAB ---------- */
  .quick-fab{
    position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--violet),#9C7CF6);color:white;border:none;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(124,108,246,0.45);
    z-index:30;transition:transform .18s ease;
  }
  .quick-fab:hover{transform:translateY(-2px) scale(1.04);}
  .quick-fab:active{transform:scale(.94);}
  @media (max-width:640px){.quick-fab{right:16px;bottom:16px;width:52px;height:52px;}}

  /* ---------- filter bar ---------- */
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 12px;}
  .filter-search{flex:2;min-width:160px;display:flex;align-items:center;gap:7px;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:7px 10px;color:var(--text-faint);}
  .filter-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;}
  .filter-select{flex:1;min-width:110px;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:8px 9px;color:var(--text);font-size:12.5px;}
  .filter-clear{font-size:12px;color:var(--text-faint);background:transparent;border:none;padding:6px 8px;white-space:nowrap;}
  .filter-clear:hover{color:var(--coral);}

  /* ---------- tags ---------- */
  .tag-chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;flex:none;white-space:nowrap;}
  .tag-picker{display:flex;flex-wrap:wrap;gap:7px;}
  .tag-toggle{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg-elev);color:var(--text-dim);cursor:pointer;transition:all .15s ease;}
  .tag-toggle.active{color:white;border-color:transparent;}
  .tag-manage-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .tag-manage-row:last-child{border-bottom:none;}
  .tag-manage-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .tag-manage-name{flex:1;font-size:13px;font-weight:500;}
  .tag-add-row{display:flex;gap:8px;margin-top:10px;}
  .tag-add-row input{flex:1;}

  /* ---------- dependencies / lock / time ---------- */
  .lock-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--coral);flex:none;}
  .dep-picker{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:9px;padding:6px 8px;background:var(--bg-elev);}
  .dep-picker label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);padding:5px 2px;cursor:pointer;}
  .dep-picker input{accent-color:var(--violet);}
  .time-badge{font-size:10.5px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:6px;flex:none;}

  /* ---------- eisenhower matrix ---------- */
  .matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:700px){.matrix-grid{grid-template-columns:1fr;}}

      {id:'t4', goalId:'g_demo2', title:'Ir al gimnasio 3 veces esta semana', priority:'alta', status:'pendiente', startDate: addDays(0), endDate: addDays(1), createdAt:todayISO(), completedAt:null, time:'18:30', tagIds:['tg_salud'], dependsOn:[], urgent:true},

function addDays(n){
  const d = new Date(); d.setDate(d.getDate()+n);

const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOW_NAMES = ["lun","mar","mié","jue","vie","sáb","dom"];
function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function monthGrid(year, monthIdx){
  const first = new Date(year, monthIdx, 1);
  const startDow = first.getDay();
  const back = startDow===0 ? 6 : startDow-1;
  const cursor = new Date(year, monthIdx, 1-back);
  const cells = [];
  for(let i=0;i<42;i++){
    cells.push({dateStr:isoOf(cursor), day:cursor.getDate(), inMonth:cursor.getMonth()===monthIdx});
    cursor.setDate(cursor.getDate()+1);
  }
  return cells;
}
function taskCoversDay(task, dateStr){
  if(!task.startDate || !task.endDate) return false;
  return task.startDate<=dateStr && dateStr<=task.endDate;
}

/* ---------------- metric helpers ---------------- */
function sortedLog(goal){
  return [...(goal.metricLog||[])].sort((a,b)=>a.date.localeCompare(b.date));
}
function metricProgress(goal){
  if(!goal.metric || goal.metric.target===null || goal.metric.target===undefined) return null;
  const log = sortedLog(goal);
  if(log.length===0) return null;
  const first = log[0].value;
  const last = log[log.length-1].value;
  const target = goal.metric.target;
  if(first===target) return 100;
  const direction = target > first ? 'up' : 'down';
  let pct = direction==='up'
    ? ((last-first)/(target-first))*100
    : ((first-last)/(first-target))*100;
  return Math.max(0, Math.min(100, pct));
}
function Sparkline({log, color}){
  if(!log || log.length<2){
    return <div className="empty-state" style={{padding:'14px 10px', fontSize:12}}>Necesitas al menos 2 registros para ver la tendencia.</div>;
  }
  const width=260, height=64, pad=8;
  const values = log.map(e=>e.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const pts = log.map((e,i)=>{
    const x = pad + (i/(log.length-1))*(width-2*pad);
    const y = height-pad - ((e.value-min)/range)*(height-2*pad);
    return {x,y};
  });
  const path = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const last = pts[pts.length-1];
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{display:'block'}}>
      <polyline points={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={last.x} cy={last.y} r="3.5" fill={color}/>
    </svg>
  );
}

/* ---------------- stats helpers ---------------- */
function startOfWeekDate(d){
  const c = new Date(d);
  const dow = c.getDay();
  const back = dow===0 ? 6 : dow-1;
  c.setDate(c.getDate()-back);
  c.setHours(0,0,0,0);
  return c;
}
function periodRange(period, offset){
  const today = new Date();
  if(period==='week'){
    const monday = startOfWeekDate(today);
    monday.setDate(monday.getDate()+offset*7);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const mName = MONTH_NAMES[monday.getMonth()].slice(0,3);
    const sName = MONTH_NAMES[sunday.getMonth()].slice(0,3);
    return {start:isoOf(monday), end:isoOf(sunday), label:`${monday.getDate()} ${mName} – ${sunday.getDate()} ${sName}`};
  }
  if(period==='month'){
    const d = new Date(today.getFullYear(), today.getMonth()+offset, 1);
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
    const name = MONTH_NAMES[d.getMonth()];
    return {start:isoOf(start), end:isoOf(end), label:`${name.charAt(0).toUpperCase()+name.slice(1)} ${d.getFullYear()}`};
  }
  const y = today.getFullYear()+offset;
  return {start:`${y}-01-01`, end:`${y}-12-31`, label:`${y}`};
}
function periodBuckets(period, range){
  if(period==='week'){
    const buckets = [];
    const d = new Date(range.start+'T00:00:00');
    for(let i=0;i<7;i++){ buckets.push({key:isoOf(d), endKey:isoOf(d), label:DOW_NAMES[i]}); d.setDate(d.getDate()+1); }
    return buckets;
  }
  if(period==='month'){
    const start = new Date(range.start+'T00:00:00');
    const end = new Date(range.end+'T00:00:00');
    const buckets = [];
    const d = new Date(start);
    while(d<=end){ buckets.push({key:isoOf(d), endKey:isoOf(d), label:String(d.getDate())}); d.setDate(d.getDate()+1); }
    return buckets;
  }
  const y = parseInt(range.start.slice(0,4));
  const buckets = [];
  for(let m=0;m<12;m++){
    buckets.push({key:isoOf(new Date(y,m,1)), endKey:isoOf(new Date(y,m+1,0)), label:MONTH_NAMES[m].slice(0,3)});
  }
  return buckets;
}
function recurringCompletionDates(tasks, startKey, endKey){
  const dates = [];
  tasks.filter(t=>t.recurring).forEach(t=>{
    Object.keys(t.completions||{}).forEach(dateStr=>{
      if(t.completions[dateStr] && (!startKey || dateStr>=startKey) && (!endKey || dateStr<=endKey)) dates.push(dateStr);
    });
  });
  return dates;
}
function completedInBucket(tasks, bucket){
  const normal = tasks.filter(t=>!t.recurring && t.completedAt && t.completedAt>=bucket.key && t.completedAt<=bucket.endKey).length;
  const recurring = recurringCompletionDates(tasks, bucket.key, bucket.endKey).length;
  return normal + recurring;
}
function currentStreak(tasks){
  const doneDates = new Set(tasks.filter(t=>!t.recurring && t.completedAt).map(t=>t.completedAt));
  recurringCompletionDates(tasks).forEach(d=>doneDates.add(d));
  let cursor = new Date();
  if(!doneDates.has(isoOf(cursor))) cursor.setDate(cursor.getDate()-1);
  let count = 0;
  while(doneDates.has(isoOf(cursor))){ count++; cursor.setDate(cursor.getDate()-1); }
  return count;
}
function BarChart({buckets, values, color}){
  const max = Math.max(1, ...values);
  return (
    <div className="stats-chart-scroll">
      <div className="stats-chart" style={{minWidth: buckets.length>14 ? buckets.length*20 : '100%'}}>
        {buckets.map((b,i)=>(
          <div className="stats-bar-col" key={b.key}>
            <span className="stats-bar-val">{values[i]>0?values[i]:''}</span>
            <div className="stats-bar-track"><div className="stats-bar-fill" style={{height:`${(values[i]/max)*100}%`, background:color}}></div></div>
            <span className="stats-bar-label">{b.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
