/* ---------------- recurring task helpers ---------------- */
function daysLabel(days){
  if(!days) return null;
  const order = [1,2,3,4,5,6,0];
  const short = {1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',0:'D'};
  return order.filter(d=>days.includes(d)).map(d=>short[d]).join(' ');
}
function taskOccursOnDate(task, dateStr){
  if(task.recurring){
    const dow = new Date(dateStr+'T00:00:00').getDay();
    return (task.recurring.days||[]).includes(dow);
  }
  return taskCoversDay(task, dateStr);
}

/* ---------------- dependency helpers ---------------- */
function isTaskBlocked(task, allTasks){
  if(!task.dependsOn || task.dependsOn.length===0) return false;
  return task.dependsOn.some(depId=>{
    const dep = (allTasks||[]).find(t=>t.id===depId);
    return dep && dep.status!=='hecho';
  });
}
function blockingTaskTitles(task, allTasks){
  if(!task.dependsOn) return [];
  return task.dependsOn
    .map(depId=>(allTasks||[]).find(t=>t.id===depId))
    .filter(dep=>dep && dep.status!=='hecho')
    .map(dep=>dep.title);
}
function shiftDateStr(dateStr, days){
  if(!dateStr) return dateStr;
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return isoOf(d);
}

/* ---------------- filter helpers ---------------- */
function taskMatchesFilter(task, filters){
  if(filters.goalId!=='all' && task.goalId!==filters.goalId) return false;
  if(filters.priority!=='all' && task.priority!==filters.priority) return false;
  if(filters.tagId && filters.tagId!=='all' && !(task.tagIds||[]).includes(filters.tagId)) return false;
  if(filters.status!=='all'){
    if(filters.status==='hito'){ if(!task.milestone) return false; }
    else if(task.status!==filters.status) return false;
  }
  if(filters.text.trim()){
    const q = filters.text.trim().toLowerCase();
    if(!task.title.toLowerCase().includes(q)) return false;
  }
  return true;
}
function hasActiveFilters(filters){
  return filters.text.trim()!=='' || filters.goalId!=='all' || filters.priority!=='all' || filters.status!=='all' || (filters.tagId && filters.tagId!=='all');
}

/* cycle pendiente -> progreso -> hecho -> pendiente */
function nextStatus(status){
  if(status==='pendiente') return 'progreso';
  if(status==='progreso') return 'hecho';
  return 'pendiente';
}

/* ---------------- progress ring ---------------- */
function ProgressRing({percent=0, size=52, stroke=5, color='#7C6CF6', trackColor='rgba(255,255,255,0.08)', label}){
  const r = (size - stroke)/2;
  const c = 2*Math.PI*r;
  const offset = c - (Math.min(100,Math.max(0,percent))/100)*c;
  return (
    <div className="ring-wrap" style={{width:size,height:size}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} stroke={trackColor} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{transition:'stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)'}}/>
      </svg>
      <span style={{fontSize:size*0.24}}>{label !== undefined ? label : Math.round(percent)+'%'}</span>
    </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [data, setData] = useState(loadData);
  const [view, setView] = useState('dashboard');
  const [theme, setTheme] = useState(data.settings.theme || 'dark');
  const [goalModal, setGoalModal] = useState(null); // null | {} | goal
  const [taskModal, setTaskModal] = useState(null); // null | {goalId} | task
  const [calMonth, setCalMonth] = useState(()=>{ const n=new Date(); return {year:n.getFullYear(), monthIdx:n.getMonth()}; });
  const [calSelected, setCalSelected] = useState(todayISO());
  const [statsPeriod, setStatsPeriod] = useState('week');
  const [statsOffset, setStatsOffset] = useState(0);
  const fileInputRef = useRef(null);
  const [importMsg, setImportMsg] = useState('');
  const [filters, setFilters] = useState({text:'', goalId:'all', priority:'all', status:'all', tagId:'all'});
  const [reviewOffset, setReviewOffset] = useState(0);

  useEffect(()=>{ saveData(data); }, [data]);
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme', theme);
    setData(d => ({...d, settings:{...d.settings, theme}}));
  }, [theme]);

  const goals = data.goals.filter(g=>!g.archived);
  const tasks = data.tasks;

  const tasksByGoal = (goalId) => tasks.filter(t=>t.goalId===goalId);
  const goalProgress = (goalId) => {
    const gt = tasksByGoal(goalId);
    if(gt.length===0) return 0;
    return Math.round((gt.filter(t=>t.status==='hecho').length / gt.length) * 100);
  };

  /* ---- mutations ---- */
  const upsertGoal = (goal) => {
    setData(d=>{
      const exists = d.goals.some(g=>g.id===goal.id);
      return {...d, goals: exists ? d.goals.map(g=>g.id===goal.id?goal:g) : [...d.goals, goal]};
    });
  };
  const deleteGoal = (goalId) => {
    if(!confirm('¿Eliminar esta meta definitivamente junto con todas sus tareas?')) return;
    setData(d=>({...d, goals:d.goals.filter(g=>g.id!==goalId), tasks:d.tasks.filter(t=>t.goalId!==goalId)}));
  };
  const archiveGoal = (goalId) => {
    setData(d=>({...d, goals: d.goals.map(g=>g.id===goalId?{...g, archived:true}:g)}));
  };
  const unarchiveGoal = (goalId) => {
    setData(d=>({...d, goals: d.goals.map(g=>g.id===goalId?{...g, archived:false}:g)}));
  };
  const toggleRecurringCompletion = (taskId, dateStr) => {
    setData(d=>({
      ...d,
      tasks: d.tasks.map(t=>{
        if(t.id!==taskId) return t;
        const comp = {...(t.completions||{})};
        if(comp[dateStr]) delete comp[dateStr]; else comp[dateStr] = true;
        return {...t, completions: comp};
      })
    }));
  };
  const addSubtask = (taskId, text) => {
    if(!text.trim()) return;
    setData(d=>({...d, tasks: d.tasks.map(t=> t.id===taskId ? {...t, subtasks:[...(t.subtasks||[]), {id:'s_'+uid(), text:text.trim(), done:false}]} : t)}));
  };
  const toggleSubtask = (taskId, subId) => {
    setData(d=>({...d, tasks: d.tasks.map(t=> t.id===taskId ? {...t, subtasks:(t.subtasks||[]).map(s=>s.id===subId?{...s,done:!s.done}:s)} : t)}));
  };
  const deleteSubtask = (taskId, subId) => {
    setData(d=>({...d, tasks: d.tasks.map(t=> t.id===taskId ? {...t, subtasks:(t.subtasks||[]).filter(s=>s.id!==subId)} : t)}));
  };
  const updateTaskNotes = (taskId, notes) => {
    setData(d=>({...d, tasks: d.tasks.map(t=> t.id===taskId ? {...t, notes} : t)}));
  };
  const exportData = () => {
    const payload = {goals: data.goals, tasks: data.tasks, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `orbit-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        setData(d=>({
          ...d,
          goals: parsed.goals || d.goals,
          tasks: parsed.tasks || d.tasks,
        }));
        setImportMsg('Copia restaurada correctamente');
      }catch(err){
        setImportMsg('El archivo no es válido');
      }
      setTimeout(()=>setImportMsg(''), 3000);
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  const upsertTask = (task) => {
    setData(d=>{
      const exists = d.tasks.some(t=>t.id===task.id);
      return {...d, tasks: exists ? d.tasks.map(t=>t.id===task.id?task:t) : [...d.tasks, task]};
    });
  };
  const addMetricEntry = (goalId, date, value) => {
    setData(d=>({
      ...d,
      goals: d.goals.map(g=>{
        if(g.id!==goalId) return g;
        const log = (g.metricLog||[]).filter(e=>e.date!==date);
        log.push({date, value});
        return {...g, metricLog: log};
      })
    }));
  };
  const deleteMetricEntry = (goalId, date) => {
    setData(d=>({
      ...d,
      goals: d.goals.map(g=> g.id===goalId ? {...g, metricLog:(g.metricLog||[]).filter(e=>e.date!==date)} : g)
    }));
  };
  const deleteTask = (taskId) => {
    setData(d=>({...d, tasks:d.tasks.filter(t=>t.id!==taskId)}));
  };
  const cycleTaskStatus = (task) => {
    const status = nextStatus(task.status);
    if(status==='hecho' && isTaskBlocked(task, tasks)){
      alert('Esta tarea está bloqueada por: ' + blockingTaskTitles(task, tasks).join(', '));
      return;
    }
    upsertTask({...task, status, completedAt: status==='hecho' ? todayISO() : null});
  };
  const setTaskStatus = (task, status) => {
    if(status==='hecho' && isTaskBlocked(task, tasks)){
      alert('Esta tarea está bloqueada por: ' + blockingTaskTitles(task, tasks).join(', '));
      return;
    }
    upsertTask({...task, status, completedAt: status==='hecho' ? todayISO() : null});
  };
  const moveTaskToNextWeek = (task) => {
    upsertTask({...task, startDate: task.startDate ? shiftDateStr(task.startDate,7) : task.startDate, endDate: shiftDateStr(task.endDate,7)});
  };
  const addTag = (name, color) => {
    if(!name.trim()) return;
    setData(d=>({...d, tags:[...(d.tags||[]), {id:'tg_'+uid(), name:name.trim(), color}]}));
  };
  const deleteTag = (tagId) => {
    setData(d=>({
      ...d,
      tags:(d.tags||[]).filter(t=>t.id!==tagId),
      tasks: d.tasks.map(t=>({...t, tagIds:(t.tagIds||[]).filter(id=>id!==tagId)}))
    }));
  };

  /* ---- dashboard stats ---- */
  const activeGoalIdSet = new Set(goals.map(g=>g.id));
  const activeTasks = tasks.filter(t=>activeGoalIdSet.has(t.goalId));
  const totalTasks = activeTasks.length;
  const doneTasks = activeTasks.filter(t=>t.status==='hecho').length;
  const globalProgress = totalTasks ? Math.round((doneTasks/totalTasks)*100) : 0;
  const todayStr = todayISO();
  const tasksToday = activeTasks.filter(t=>t.status!=='hecho' && t.startDate && t.endDate && t.startDate<=todayStr && todayStr<=t.endDate);
  const upcoming = activeTasks
    .filter(t=>t.status!=='hecho' && t.endDate)
    .sort((a,b)=> a.endDate.localeCompare(b.endDate))
    .slice(0,6);
  const upcomingMilestones = activeTasks
    .filter(t=>t.milestone && t.status!=='hecho' && t.endDate)
    .sort((a,b)=> a.endDate.localeCompare(b.endDate))
    .slice(0,4);

  const goalTitle = (goalId) => goals.find(g=>g.id===goalId)?.title || data.goals.find(g=>g.id===goalId)?.title || '—';
  const goalColor = (goalId) => (goals.find(g=>g.id===goalId) || data.goals.find(g=>g.id===goalId) || {}).color || 'violet';

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="orbitCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#9C7CF6"/>
                  <stop offset="100%" stopColor="#2DD9C7"/>
                </linearGradient>
                <radialGradient id="orbitBgGlow" cx="50%" cy="50%" r="65%">
                  <stop offset="0%" stopColor="#1C2140"/>
                  <stop offset="100%" stopColor="#0B0E1A"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="98" fill="url(#orbitBgGlow)"/>
              <ellipse cx="100" cy="100" rx="72" ry="72" fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="2"/>
              <g className="orbit-ring">
                <ellipse cx="100" cy="100" rx="80" ry="42" fill="none" stroke="#2DD9C7" strokeWidth="4"
                  strokeDasharray="8 9" opacity="0.9" transform="rotate(-18 100 100)"/>
                <circle cx="167" cy="83" r="8" fill="#2DD9C7" transform="rotate(-18 100 100)"/>
              </g>
              <circle cx="100" cy="100" r="22" fill="url(#orbitCoreGrad)"/>
            </svg>
          </div>
          <div className="brand-text">
            <div className="name">Orbit</div>
            <div className="tag">metas en órbita</div>
          </div>
        </div>
        <div className="top-actions">
          <button className="icon-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} title="Cambiar tema">
            {theme==='dark' ? <IconSun size={17}/> : <IconMoon size={17}/>}
          </button>
          <button className="btn btn-primary" onClick={()=>setGoalModal({})}>
            <IconPlus size={16}/> Nueva meta
          </button>
        </div>
      </div>

      <div className="nav-tabs">
        <button className={"nav-tab "+(view==='dashboard'?'active':'')} onClick={()=>setView('dashboard')}><IconHome size={15}/> Dashboard</button>
        <button className={"nav-tab "+(view==='goals'?'active':'')} onClick={()=>setView('goals')}><IconTarget size={15}/> Metas</button>
        <button className={"nav-tab "+(view==='kanban'?'active':'')} onClick={()=>setView('kanban')}><IconGrid size={15}/> Kanban</button>
        <button className={"nav-tab "+(view==='matriz'?'active':'')} onClick={()=>setView('matriz')}><IconMatrix size={15}/> Matriz</button>
        <button className={"nav-tab "+(view==='calendario'?'active':'')} onClick={()=>setView('calendario')}><IconCalendar size={15}/> Calendario</button>
        <button className={"nav-tab "+(view==='revision'?'active':'')} onClick={()=>setView('revision')}><IconClock size={15}/> Revisión</button>
        <button className={"nav-tab "+(view==='stats'?'active':'')} onClick={()=>setView('stats')}><IconBarChart size={15}/> Estadísticas</button>
      </div>

      {(view==='goals' || view==='kanban' || view==='calendario' || view==='matriz') && (
        <FilterBar filters={filters} setFilters={setFilters} goals={goals} tags={data.tags}/>
      )}

      {view==='dashboard' && (
        <Dashboard
          goals={goals} tasksToday={tasksToday} globalProgress={globalProgress}
          upcoming={upcoming} goalTitle={goalTitle} goalColor={goalColor}
          totalTasks={totalTasks} doneTasks={doneTasks}
          upcomingMilestones={upcomingMilestones}
        />
      )}

      {view==='goals' && (
        <GoalsView
          goals={goals} archivedGoals={data.goals.filter(g=>g.archived)}
          tasksByGoal={tasksByGoal} goalProgress={goalProgress}
          onEditGoal={setGoalModal} onArchiveGoal={archiveGoal}
          onRestoreGoal={unarchiveGoal} onDeleteGoalPermanent={deleteGoal}
          onAddTask={(goalId)=>setTaskModal({goalId})}
          onEditTask={setTaskModal} onDeleteTask={deleteTask} onToggleTask={cycleTaskStatus}
          onToggleRecurring={toggleRecurringCompletion}
          onAddMetricEntry={addMetricEntry} onDeleteMetricEntry={deleteMetricEntry}
          onAddSubtask={addSubtask} onToggleSubtask={toggleSubtask} onDeleteSubtask={deleteSubtask}
          onUpdateNotes={updateTaskNotes}
          filters={filters} tags={data.tags}
        />
      )}

      {view==='kanban' && (
        <KanbanView
          tasks={tasks.filter(t=>!t.recurring)} goalTitle={goalTitle} goalColor={goalColor}
          onStatusChange={setTaskStatus} onEditTask={setTaskModal}
          filters={filters} tags={data.tags}
        />
      )}

      {view==='matriz' && (
        <EisenhowerView
          tasks={tasks.filter(t=>!t.recurring)} goalTitle={goalTitle} goalColor={goalColor}
          onEditTask={setTaskModal} filters={filters} allTasksForBlock={tasks}
        />
      )}

      {view==='calendario' && (
        <CalendarView
          tasks={tasks} goalTitle={goalTitle} goalColor={goalColor}
          calMonth={calMonth} setCalMonth={setCalMonth}
          calSelected={calSelected} setCalSelected={setCalSelected}
          onEditTask={setTaskModal} onToggleTask={cycleTaskStatus}
          onToggleRecurring={toggleRecurringCompletion}
          filters={filters} tags={data.tags}
        />
      )}

      {view==='revision' && (
        <WeeklyReviewView
          tasks={tasks} goalTitle={goalTitle} goalColor={goalColor}
          onEditTask={setTaskModal} onMoveTask={moveTaskToNextWeek}
          offset={reviewOffset} setOffset={setReviewOffset}
        />
      )}

      {view==='stats' && (
        <StatsView
          goals={goals} allGoals={data.goals} tasks={tasks} goalTitle={goalTitle} goalColor={goalColor}
          period={statsPeriod} setPeriod={(p)=>{setStatsPeriod(p); setStatsOffset(0);}}
          offset={statsOffset} setOffset={setStatsOffset}
        />
      )}

      <TagsManager tags={data.tags} onAdd={addTag} onDelete={deleteTag}/>

      <div className="card-like-chart" style={{marginTop:30}}>
        <div className="section-title" style={{margin:'0 0 12px'}}><h2>Copia de seguridad</h2></div>
        <div className="backup-actions">
          <button className="btn btn-ghost btn-sm" onClick={exportData}>Exportar datos</button>
          <button className="btn btn-ghost btn-sm" onClick={triggerImport}>Importar datos</button>
        </div>
        <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleImportFile} />
        {importMsg && <p style={{fontSize:12, color:'var(--text-dim)', marginTop:10}}>{importMsg}</p>}
        <p style={{fontSize:11.5, color:'var(--text-faint)', marginTop:10}}>Tus datos ya se guardan en este dispositivo automáticamente. Exporta una copia de vez en cuando por si cambias de navegador o los borras sin querer.</p>
      </div>

      <div className="footer-note">Orbit · tus datos se guardan solo en este navegador</div>

      {goals.length>0 && (
        <button className="quick-fab" onClick={()=>setTaskModal({goalId: filters.goalId!=='all' ? filters.goalId : goals[0].id})} title="Añadir tarea rápida" aria-label="Añadir tarea rápida">
          <IconPlus size={24}/>
        </button>
      )}

      {goalModal !== null && (
        <GoalModal
          goal={goalModal}
          onClose={()=>setGoalModal(null)}
          onSave={(g)=>{upsertGoal(g); setGoalModal(null);}}
        />
      )}
      {taskModal !== null && (
        <TaskModal
          task={taskModal}
          goals={goals}
          tags={data.tags}
          allTasks={tasks}
          onClose={()=>setTaskModal(null)}
          onSave={(t)=>{upsertTask(t); setTaskModal(null);}}
        />
      )}
    </div>
  );
}

/* ---------------- Filter bar ---------------- */
function FilterBar({filters, setFilters, goals, tags}){
  return (
    <div className="filter-bar">
      <div className="filter-search">
        <IconSearch size={14}/>
        <input type="text" placeholder="Buscar tareas..." value={filters.text}
          onChange={e=>setFilters(f=>({...f, text:e.target.value}))}/>
      </div>
      <select className="filter-select" value={filters.goalId} onChange={e=>setFilters(f=>({...f, goalId:e.target.value}))}>
        <option value="all">Todas las metas</option>
        {goals.map(g=><option key={g.id} value={g.id}>{g.title}</option>)}
      </select>
      <select className="filter-select" value={filters.priority} onChange={e=>setFilters(f=>({...f, priority:e.target.value}))}>
        <option value="all">Toda prioridad</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
      <select className="filter-select" value={filters.status} onChange={e=>setFilters(f=>({...f, status:e.target.value}))}>
        <option value="all">Todo estado</option>
        <option value="pendiente">Pendiente</option>
        <option value="progreso">En progreso</option>
        <option value="hecho">Hecho</option>
        <option value="hito">Solo hitos ⭐</option>
      </select>
      {tags && tags.length>0 && (
        <select className="filter-select" value={filters.tagId||'all'} onChange={e=>setFilters(f=>({...f, tagId:e.target.value}))}>
          <option value="all">Toda etiqueta</option>
          {tags.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
      )}
      {hasActiveFilters(filters) && (
        <button className="filter-clear" onClick={()=>setFilters({text:'', goalId:'all', priority:'all', status:'all', tagId:'all'})}>Limpiar</button>
      )}
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
function Dashboard({goals, tasksToday, globalProgress, upcoming, goalTitle, goalColor, totalTasks, doneTasks, upcomingMilestones}){
  const fmtDate = (iso) => {
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
  };
  const isOverdue = (iso) => iso < todayISO();
  const rangeLabel = (t) => t.startDate && t.endDate && t.startDate !== t.endDate
    ? `${fmtDate(t.startDate)} → ${fmtDate(t.endDate)}` : fmtDate(t.endDate);

  return (
    <div className="fade-view">
      {upcomingMilestones && upcomingMilestones.length > 0 && (
        <React.Fragment>
          <div className="section-title">
            <h2>Próximos hitos <span className="count">{upcomingMilestones.length}</span></h2>
          </div>
          <div className="deadline-list" style={{marginBottom:8}}>
            {upcomingMilestones.map(t=>{
              const overdue = isOverdue(t.endDate);
              return (
                <div className="deadline-row" key={t.id} style={{borderColor:'var(--amber)', background:'var(--amber-soft)'}}>
                  <IconStar size={15} style={{color:'var(--amber)', flex:'none'}}/>
                  <div style={{flex:1, minWidth:0}}>
                    <div className="deadline-title">{t.title}</div>
                    <div className="deadline-goal">{goalTitle(t.goalId)}</div>
                  </div>
                  <span className="deadline-date" style={{
                    color: overdue ? '#FF6B7A' : 'var(--amber)',
                    background: overdue ? 'rgba(255,107,122,0.14)' : 'rgba(255,180,84,0.14)'
                  }}>{overdue ? 'Vencido · ' : ''}{rangeLabel(t)}</span>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}
      <div className="stat-grid">
        <div className="stat-card" style={{'--accent-soft':'var(--violet-soft)'}}>
          <div className="stat-label">Metas activas</div>
          <div className="stat-value">{goals.length}</div>
          <div className="stat-sub">en curso ahora mismo</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--blue-soft)'}}>
          <div className="stat-label">Tareas de hoy</div>
          <div className="stat-value">{tasksToday.length}</div>
          <div className="stat-sub">pendientes para hoy</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--teal-soft)'}}>
          <div className="stat-label">Tareas totales</div>
          <div className="stat-value">{doneTasks}/{totalTasks}</div>
          <div className="stat-sub">completadas</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--green-soft)', display:'flex', alignItems:'center', gap:14}}>
          <ProgressRing percent={globalProgress} size={54} stroke={6} color="#4ADE9E"/>
          <div>
            <div className="stat-label">Progreso global</div>
            <div className="stat-sub">de todas tus metas</div>
          </div>
        </div>
      </div>

      <div className="section-title">
        <h2>Próximas a vencer <span className="count">{upcoming.length}</span></h2>
      </div>
      {upcoming.length === 0 ? (
        <div className="empty-state"><b>Nada pendiente por vencer.</b> Todas tus tareas están al día.</div>
      ) : (
        <div className="deadline-list">
          {upcoming.map(t=>{
            const overdue = isOverdue(t.endDate);
            return (
              <div className="deadline-row" key={t.id}>
                {t.milestone ? <IconStar size={13} style={{color:'var(--amber)', flex:'none'}}/> : <span className="prio-dot" style={{background:PRIORITY[t.priority].solid}}></span>}
                <div style={{flex:1, minWidth:0}}>
                  <div className="deadline-title">{t.title}</div>
                  <div className="deadline-goal">{goalTitle(t.goalId)}</div>
                </div>
                <span className="deadline-date" style={{
                  color: overdue ? '#FF6B7A' : 'var(--text-dim)',
                  background: overdue ? 'rgba(255,107,122,0.14)' : 'var(--bg-elev)'
                }}>{overdue ? 'Vencida · ' : ''}{rangeLabel(t)}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- Goals view ---------------- */
function GoalsView({goals, archivedGoals, tasksByGoal, goalProgress, onEditGoal, onArchiveGoal, onRestoreGoal, onDeleteGoalPermanent, onAddTask, onEditTask, onDeleteTask, onToggleTask, onToggleRecurring, onAddMetricEntry, onDeleteMetricEntry, onAddSubtask, onToggleSubtask, onDeleteSubtask, onUpdateNotes, filters, tags}){
  const taskFiltersActive = filters.text.trim()!=='' || filters.priority!=='all' || filters.status!=='all';
  const visibleGoals = goals.filter(g=>{
    if(filters.goalId!=='all' && g.id!==filters.goalId) return false;
    if(taskFiltersActive){
      const gt = tasksByGoal(g.id);
      return gt.some(t=>taskMatchesFilter(t, filters));
    }
    return true;
  });
  return (
    <div className="fade-view">
      {goals.length===0 ? (
        <div className="empty-state" style={{marginTop:10}}><b>Aún no tienes metas.</b> Crea tu primera meta para empezar a orbitar tus objetivos.</div>
      ) : visibleGoals.length===0 ? (
        <div className="empty-state" style={{marginTop:10}}><b>Sin resultados.</b> Ninguna tarea coincide con los filtros actuales.</div>
      ) : (
        <div className="goals-grid">
          {visibleGoals.map(g=>(
            <GoalCard key={g.id} goal={g} tasks={tasksByGoal(g.id)} progress={goalProgress(g.id)}
              onEdit={()=>onEditGoal(g)} onArchive={()=>onArchiveGoal(g.id)}
              onAddTask={()=>onAddTask(g.id)} onEditTask={onEditTask} onDeleteTask={onDeleteTask}
              onToggleTask={onToggleTask} onToggleRecurring={onToggleRecurring}
              onAddMetricEntry={onAddMetricEntry} onDeleteMetricEntry={onDeleteMetricEntry}
              onAddSubtask={onAddSubtask} onToggleSubtask={onToggleSubtask} onDeleteSubtask={onDeleteSubtask}
              onUpdateNotes={onUpdateNotes} filters={filters} tags={tags}/>
          ))}
        </div>
      )}
      <ArchivedGoals archivedGoals={archivedGoals} onRestore={onRestoreGoal} onDeletePermanent={onDeleteGoalPermanent}/>
    </div>
  );
}

function ArchivedGoals({archivedGoals, onRestore, onDeletePermanent}){
  const [open, setOpen] = useState(false);
  if(!archivedGoals || archivedGoals.length===0) return null;
  return (
    <div style={{marginTop:30}}>
      <div className="section-title" style={{cursor:'pointer'}} onClick={()=>setOpen(o=>!o)}>
        <h2>Metas archivadas <span className="count">{archivedGoals.length}</span></h2>
        <IconChevron size={16} style={{transform: open?'rotate(180deg)':'none', transition:'transform .2s'}}/>
      </div>
      {open && (
        <div className="deadline-list">
          {archivedGoals.map(g=>(
            <div className="deadline-row" key={g.id}>
              <span className="prio-dot" style={{background:(COLORS[g.color]||COLORS.violet).solid}}></span>
              <div style={{flex:1, minWidth:0}}>
                <div className="deadline-title">{g.title}</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={()=>onRestore(g.id)}>Restaurar</button>
              <button className="icon-btn" style={{width:32,height:32}} onClick={()=>onDeletePermanent(g.id)} title="Eliminar definitivamente"><IconTrash size={14}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function GoalCard({goal, tasks, progress, onEdit, onArchive, onAddTask, onEditTask, onDeleteTask, onToggleTask, onToggleRecurring, onAddMetricEntry, onDeleteMetricEntry, onAddSubtask, onToggleSubtask, onDeleteSubtask, onUpdateNotes, filters, tags}){
  const [open, setOpen] = useState(true);
  const color = COLORS[goal.color] || COLORS.violet;
  const taskFiltersActive = filters && (filters.text.trim()!=='' || filters.priority!=='all' || filters.status!=='all');
  const filteredTasks = taskFiltersActive ? tasks.filter(t=>taskMatchesFilter(t, filters)) : tasks;
  const normalTasks = filteredTasks.filter(t=>!t.recurring);
  const recurringTasks = filteredTasks.filter(t=>t.recurring);
  const today = todayISO();
  const sorted = [...normalTasks].sort((a,b)=>{
    if((a.status==='hecho') !== (b.status==='hecho')) return a.status==='hecho' ? 1 : -1;
    return (a.endDate||'9999').localeCompare(b.endDate||'9999');
  });
  const hasMetric = !!goal.metric;
  const log = hasMetric ? sortedLog(goal) : [];
  const metricPct = hasMetric ? metricProgress(goal) : null;
  const displayPct = metricPct !== null ? metricPct : (progress || 0);

  const [mDate, setMDate] = useState(todayISO());
  const [mValue, setMValue] = useState('');
  const submitMetric = (e) => {
    e.preventDefault();
    const v = parseFloat(mValue);
    if(isNaN(v) || !mDate) return;
    onAddMetricEntry(goal.id, mDate, v);
    setMValue('');
  };

  return (
    <div className="goal-card">
      <div className="goal-top">
        <ProgressRing percent={displayPct} size={50} stroke={5} color={color.solid}/>
        <div className="goal-info">
          <div className="goal-title">{goal.title}</div>
          <div className="goal-meta">
            {hasMetric
              ? (log.length ? `${goal.metric.name}: ${log[log.length-1].value}${goal.metric.unit?(' '+goal.metric.unit):''}` : `${goal.metric.name} · sin registros aún`)
              : `${normalTasks.filter(t=>t.status==='hecho').length}/${normalTasks.length} tareas completadas`}
            {recurringTasks.length>0 ? ` · ${recurringTasks.length} recurrente${recurringTasks.length===1?'':'s'}` : ''}
          </div>
        </div>
        <div className="goal-actions">
          <button className="icon-btn" style={{width:32,height:32}} onClick={onEdit} title="Editar meta"><IconEdit size={14}/></button>
          <button className="icon-btn" style={{width:32,height:32}} onClick={onArchive} title="Archivar meta"><IconArchive size={14}/></button>
          <button className="icon-btn" style={{width:32,height:32}} onClick={()=>setOpen(o=>!o)} title="Mostrar/ocultar detalle">
            <IconChevron size={14} style={{transform: open?'rotate(180deg)':'none', transition:'transform .2s'}}/>
          </button>
        </div>
      </div>

      {!hasMetric && progress===100 && normalTasks.length>0 && (
        <div style={{marginTop:12, display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, background:'var(--green-soft)', padding:'8px 12px', borderRadius:10, fontSize:12.5}}>
          <span style={{color:'var(--green)'}}>🎉 ¡Meta completada!</span>
          <button className="btn btn-primary btn-sm" onClick={onArchive}>Archivar</button>
        </div>
      )}

      {open && (
        <div className="goal-body">
          {hasMetric && (
            <div className="metric-section">
              <div className="metric-head">
                <span className="metric-name">{goal.metric.name}</span>
                {goal.metric.target!==null && goal.metric.target!==undefined && (
                  <span className="metric-target">objetivo: {goal.metric.target}{goal.metric.unit?(' '+goal.metric.unit):''}</span>
                )}
              </div>
              <Sparkline log={log} color={color.solid}/>
              <form className="metric-quickadd" onSubmit={submitMetric}>
                <input type="date" value={mDate} onChange={e=>setMDate(e.target.value)} />
                <input type="number" step="any" placeholder={goal.metric.unit || 'valor'} value={mValue} onChange={e=>setMValue(e.target.value)} />
                <button type="submit" className="btn btn-primary btn-sm" style={{padding:'8px 12px'}}><IconPlus size={13}/></button>
              </form>
              {log.length>0 && (
                <div className="metric-log-list">
                  {[...log].reverse().slice(0,4).map(e=>(
                    <div className="metric-log-row" key={e.date}>
                      <span className="metric-log-date">{e.date}</span>
                      <span className="metric-log-value">{e.value}{goal.metric.unit?(' '+goal.metric.unit):''}</span>
                      <button className="task-del" onClick={()=>onDeleteMetricEntry(goal.id, e.date)} title="Eliminar registro"><IconX size={12}/></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {recurringTasks.length>0 && (
            <React.Fragment>
              <div className="metric-target" style={{margin:'2px 0 6px', fontWeight:700, color:'var(--text-dim)'}}>Tareas recurrentes</div>
              <div className="goal-tasklist" style={{marginBottom:14}}>
                {recurringTasks.map(t=>(
                  <TaskRow key={t.id} task={t} tags={tags}
                    checked={!!(t.completions && t.completions[today])}
                    onToggle={()=>onToggleRecurring(t.id, today)}
                    onEdit={()=>onEditTask(t)} onDelete={()=>onDeleteTask(t.id)}
                    onAddSubtask={onAddSubtask} onToggleSubtask={onToggleSubtask} onDeleteSubtask={onDeleteSubtask}
                    onUpdateNotes={onUpdateNotes} recurBadge={daysLabel(t.recurring.days)}/>
                ))}
              </div>
            </React.Fragment>
          )}

          <div className="goal-tasklist">
            {sorted.length===0 && <div className="empty-state" style={{padding:'16px 10px'}}>{hasMetric ? 'Sin tareas asociadas.' : 'Sin tareas todavía.'}</div>}
            {sorted.map(t=>(
              <TaskRow key={t.id} task={t} tags={tags} onToggle={()=>onToggleTask(t)} onEdit={()=>onEditTask(t)} onDelete={()=>onDeleteTask(t.id)}
                onAddSubtask={onAddSubtask} onToggleSubtask={onToggleSubtask} onDeleteSubtask={onDeleteSubtask}
                onUpdateNotes={onUpdateNotes}
                blocked={isTaskBlocked(t, tasks)} blockReason={blockingTaskTitles(t, tasks).join(', ')}/>
            ))}
          </div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:10, width:'100%', justifyContent:'center'}} onClick={onAddTask}>
            <IconPlus size={14}/> Añadir tarea
          </button>
        </div>
      )}
    </div>
  );
}

function TaskRow({task, checked, onToggle, onEdit, onDelete, hideDelete, recurBadge,
  onAddSubtask, onToggleSubtask, onDeleteSubtask, onUpdateNotes, tags=[], blocked=false, blockReason=''}){
  const isRecurring = !!task.recurring;
  const done = checked !== undefined ? checked : task.status === 'hecho';
  const inProgress = !isRecurring && task.status === 'progreso';
  const prio = PRIORITY[task.priority];
  const overdue = !isRecurring && !done && task.endDate && task.endDate < todayISO();
  const rangeLabel = !isRecurring && task.startDate && task.endDate
    ? (task.startDate === task.endDate ? task.endDate.slice(5) : `${task.startDate.slice(5)} → ${task.endDate.slice(5)}`)
    : (!isRecurring && task.endDate ? task.endDate.slice(5) : '');
  const subtasks = task.subtasks || [];
  const subDone = subtasks.filter(s=>s.done).length;
  const hasNotes = !!(task.notes||'').trim();
  const [panel, setPanel] = useState(null); // null | 'subtasks' | 'notes'
  const [subInput, setSubInput] = useState('');
  const [noteDraft, setNoteDraft] = useState(task.notes || '');

  const openNotePanel = () => { setNoteDraft(task.notes || ''); setPanel(p => p==='notes' ? null : 'notes'); };
  const saveNote = () => { onUpdateNotes(task.id, noteDraft); setPanel(null); };
  const submitSubtask = (e) => { e.preventDefault(); if(!subInput.trim()) return; onAddSubtask(task.id, subInput); setSubInput(''); };

  return (
    <React.Fragment>
      <div className={"task-row "+(done?'done':'')}>
        <button className={"task-check "+(done?'checked':'')+(inProgress?' progress':'')} onClick={onToggle}
          title={isRecurring ? 'Marcar hoy como hecho' : 'Pendiente → En progreso → Hecho'}>
          {done && <Icon size={12} stroke="white"><path d="M20 6L9 17l-5-5"/></Icon>}
          {inProgress && <span className="task-check-dot"></span>}
        </button>
        {task.milestone && <IconStar size={13} style={{color:'var(--amber)', flex:'none'}} title="Hito"/>}
        <span className="task-title" onClick={onEdit} style={{cursor:'pointer'}}>{task.title}</span>
        {isRecurring && recurBadge && <span className="task-badge-mini">↻ {recurBadge}</span>}
        {subtasks.length>0 && <span className="task-badge-mini">{subDone}/{subtasks.length}</span>}
        {task.time && <span className="time-badge">{task.time}</span>}
        {(task.tagIds||[]).map(tid=>{
          const tg = tags.find(t=>t.id===tid);
          if(!tg) return null;
          const c = COLORS[tg.color]||COLORS.violet;
          return <span key={tid} className="tag-chip" style={{color:c.solid, background:c.soft}}>{tg.name}</span>;
        })}
        {blocked && <span className="lock-badge" title={blockReason||'Bloqueada'}><IconLock size={11}/></span>}
        {rangeLabel && <span className="due-pill" style={overdue?{color:'#FF6B7A'}:{}}>{rangeLabel}</span>}
        <span className="prio-pill" style={{color:prio.solid, background:prio.soft}}>{prio.label}</span>
        {onAddSubtask && (
          <button className="icon-btn" style={{width:26,height:26}} onClick={()=>setPanel(p=>p==='subtasks'?null:'subtasks')} title="Subtareas">
            <IconChecklist size={13}/>
          </button>
        )}
        {onUpdateNotes && (
          <button className="icon-btn" style={{width:26,height:26, color: hasNotes ? 'var(--violet)' : undefined}} onClick={openNotePanel} title="Nota">
            <IconNote size={13}/>
          </button>
        )}
        {!hideDelete && <button className="task-del" onClick={onDelete} title="Eliminar tarea"><IconX size={14}/></button>}
      </div>
      {panel==='subtasks' && (
        <div className="task-subpanel">
          {subtasks.length===0 && <div style={{fontSize:12, color:'var(--text-faint)', marginBottom:4}}>Sin pasos todavía.</div>}
          {subtasks.map(s=>(
            <div className="subtask-row" key={s.id}>
              <button className={"subtask-check "+(s.done?'checked':'')} onClick={()=>onToggleSubtask(task.id, s.id)}>
                {s.done && <Icon size={10} stroke="white"><path d="M20 6L9 17l-5-5"/></Icon>}
              </button>
              <span className={"subtask-text "+(s.done?'done':'')}>{s.text}</span>
              <button className="task-del" onClick={()=>onDeleteSubtask(task.id, s.id)}><IconX size={12}/></button>
            </div>
          ))}
          <form className="subtask-add-row" onSubmit={submitSubtask}>
            <input type="text" value={subInput} onChange={e=>setSubInput(e.target.value)} placeholder="Añadir paso..." />
            <button type="submit" className="btn btn-ghost btn-sm" style={{padding:'6px 10px'}}><IconPlus size={12}/></button>
          </form>
        </div>
      )}
      {panel==='notes' && (
        <div className="task-subpanel task-note-area">
          <textarea value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} placeholder="Nota para esta tarea..." autoFocus/>
          <div style={{display:'flex', gap:8, marginTop:8}}>
            <button className="btn btn-primary btn-sm" onClick={saveNote}>Guardar</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setPanel(null)}>Cancelar</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ---------------- Kanban view ---------------- */
function KanbanView({tasks, goalTitle, goalColor, onStatusChange, onEditTask, filters, tags=[]}){
  const [dragOverCol, setDragOverCol] = useState(null);
  const dragTaskId = useRef(null);
  const filteredTasks = filters ? tasks.filter(t=>taskMatchesFilter(t, filters)) : tasks;

  const byStatus = (status) => filteredTasks
    .filter(t=>t.status===status)
    .sort((a,b)=>(a.endDate||'9999').localeCompare(b.endDate||'9999'));

  return (
    <div className="fade-view kanban-wrap">
      {STATUS_COLS.map(col=>{
        const colTasks = byStatus(col.key);
        return (
          <div key={col.key}
            className={"kanban-col "+(dragOverCol===col.key?'drag-over':'')}
            onDragOver={(e)=>{e.preventDefault(); setDragOverCol(col.key);}}
            onDragLeave={()=>setDragOverCol(c=>c===col.key?null:c)}
            onDrop={(e)=>{
              e.preventDefault();
              const id = dragTaskId.current;
              if(id){
                const t = tasks.find(x=>x.id===id);
                if(t) onStatusChange(t, col.key);
              }
              setDragOverCol(null);
            }}
          >
            <div className="kanban-col-head">
              <span className="kanban-col-dot" style={{background:col.dot}}></span>
              <span className="kanban-col-title">{col.label}</span>
              <span className="kanban-col-count">{colTasks.length}</span>
            </div>
            <div className="kanban-cards">
              {colTasks.length===0 && <div className="empty-state" style={{padding:'14px 8px', fontSize:12}}>Sin tareas</div>}
              {colTasks.map(t=>{
                const color = COLORS[goalColor(t.goalId)] || COLORS.violet;
                const prio = PRIORITY[t.priority];
                const overdue = t.status!=='hecho' && t.endDate && t.endDate < todayISO();
                return (
                  <div key={t.id} className="kanban-card" draggable
                    onDragStart={()=>{dragTaskId.current=t.id;}}
                    onClick={()=>onEditTask(t)}
                  >
                    <div className="kanban-card-goal" style={{color:color.solid}}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:color.solid,display:'inline-block'}}></span>
                      {goalTitle(t.goalId)}
                    </div>
                    <div className="kanban-card-title">{t.title}</div>
                    <div className="kanban-card-foot">
                      <span className="prio-pill" style={{color:prio.solid, background:prio.soft}}>{prio.label}</span>
                      {isTaskBlocked(t, tasks) && <IconLock size={11} style={{color:'var(--coral)'}}/>}
                      {t.endDate && <span className="due-pill" style={overdue?{color:'#FF6B7A'}:{}}>{t.endDate.slice(5)}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Eisenhower matrix view ---------------- */
function EisenhowerView({tasks, goalTitle, goalColor, onEditTask, filters, allTasksForBlock}){
  const filtered = (filters ? tasks.filter(t=>taskMatchesFilter(t, filters)) : tasks).filter(t=>t.status!=='hecho');
  const quads = [
    {key:'q1', title:'Hacer ahora', sub:'urgente + importante', color:'var(--coral)', test:t=>t.urgent && t.priority!=='baja'},
    {key:'q2', title:'Planificar', sub:'importante, no urgente', color:'var(--violet)', test:t=>!t.urgent && t.priority!=='baja'},
    {key:'q3', title:'Delegar', sub:'urgente, no importante', color:'var(--amber)', test:t=>t.urgent && t.priority==='baja'},
    {key:'q4', title:'Repensar', sub:'ni urgente ni importante', color:'var(--text-faint)', test:t=>!t.urgent && t.priority==='baja'},
  ];
  return (
    <div className="fade-view">
      <p style={{fontSize:12.5, color:'var(--text-faint)', margin:'0 0 16px'}}>Marca una tarea como "urgente" al crearla o editarla para ubicarla aquí. La importancia se toma de la prioridad (alta/media = importante). Las tareas hechas no se muestran.</p>
      <div className="matrix-grid">
        {quads.map(q=>{
          const qTasks = filtered.filter(q.test);
          return (
            <div className="matrix-quad" key={q.key} style={{borderColor:q.color}}>
              <div className="matrix-quad-head">
                <div>
                  <span className="matrix-quad-title" style={{color:q.color}}>{q.title}</span>
                  <span className="matrix-quad-sub">{q.sub}</span>
                </div>
                <span className="matrix-quad-count">{qTasks.length}</span>
              </div>
              <div className="matrix-cards">
                {qTasks.length===0 && <div style={{fontSize:11.5, color:'var(--text-faint)'}}>Sin tareas</div>}
                {qTasks.map(t=>{
                  const color = COLORS[goalColor(t.goalId)] || COLORS.violet;
                  const prio = PRIORITY[t.priority];
                  const blocked = isTaskBlocked(t, allTasksForBlock||tasks);
                  return (
                    <div key={t.id} className="kanban-card" onClick={()=>onEditTask(t)}>
                      <div className="kanban-card-goal" style={{color:color.solid}}>
                        <span style={{width:6,height:6,borderRadius:'50%',background:color.solid,display:'inline-block'}}></span>
                        {goalTitle(t.goalId)}
                      </div>
                      <div className="kanban-card-title">{t.title}</div>
                      <div className="kanban-card-foot">
                        <span className="prio-pill" style={{color:prio.solid, background:prio.soft}}>{prio.label}</span>
                        {blocked && <IconLock size={11} style={{color:'var(--coral)'}}/>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Calendar view ---------------- */
function CalendarView({tasks, goalTitle, goalColor, calMonth, setCalMonth, calSelected, setCalSelected, onEditTask, onToggleTask, onToggleRecurring, filters, tags=[]}){
  const cells = useMemo(()=>monthGrid(calMonth.year, calMonth.monthIdx), [calMonth]);
  const todayStr = todayISO();
  const filteredTasks = filters ? tasks.filter(t=>taskMatchesFilter(t, filters)) : tasks;
  const goToMonth = (delta) => {
    const d = new Date(calMonth.year, calMonth.monthIdx+delta, 1);
    setCalMonth({year:d.getFullYear(), monthIdx:d.getMonth()});
  };
  const dayTasks = (dateStr) => filteredTasks.filter(t=>taskOccursOnDate(t, dateStr));
  const selectedTasks = dayTasks(calSelected).sort((a,b)=>{
    const at = a.time || '99:99', bt = b.time || '99:99';
    if(at!==bt) return at.localeCompare(bt);
    return (a.endDate||'').localeCompare(b.endDate||'');
  });
  const handleToggle = (t) => { t.recurring ? onToggleRecurring(t.id, calSelected) : onToggleTask(t); };

  return (
    <div className="fade-view">
      <div className="cal-nav">
        <button className="icon-btn" onClick={()=>goToMonth(-1)} title="Mes anterior"><Icon size={16}><path d="M15 18l-6-6 6-6"/></Icon></button>
        <span className="cal-month-label">{MONTH_NAMES[calMonth.monthIdx].charAt(0).toUpperCase()+MONTH_NAMES[calMonth.monthIdx].slice(1)} {calMonth.year}</span>
        <button className="icon-btn" onClick={()=>goToMonth(1)} title="Mes siguiente"><Icon size={16}><path d="M9 18l6-6-6-6"/></Icon></button>
      </div>

      <div className="orbit-cal-grid">
        {DOW_NAMES.map(d=><div className="orbit-cal-dow" key={d}>{d}</div>)}
        {cells.map(cell=>{
          const dts = dayTasks(cell.dateStr);
          const isToday = cell.dateStr===todayStr;
          const isSelected = cell.dateStr===calSelected;
          const hasMilestone = dts.some(t=>t.milestone);
          return (
            <div key={cell.dateStr}
              className={"orbit-cal-cell "+(cell.inMonth?'':'other-month')+(isToday?' today':'')+(isSelected?' selected':'')}
              style={hasMilestone && !isSelected ? {borderColor:'var(--amber)', boxShadow:'0 0 0 1px var(--amber) inset'} : undefined}
              onClick={()=>setCalSelected(cell.dateStr)}>
              <span className="orbit-cal-daynum">{cell.day}</span>
              {hasMilestone ? (
                <IconStar size={9} style={{color: isSelected ? '#fff' : 'var(--amber)'}}/>
              ) : (
                <div className="orbit-cal-bars">
                  {dts.slice(0,3).map(t=>(
                    <span key={t.id} className="orbit-cal-bar" style={{background:(COLORS[goalColor(t.goalId)]||COLORS.violet).solid, opacity: t.status==='hecho'?0.4:1}}></span>
                  ))}
                  {dts.length>3 && <span className="orbit-cal-more">+{dts.length-3}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="section-title">
        <h2>{new Date(calSelected+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'})}</h2>
        <span className="count">{selectedTasks.length} tarea{selectedTasks.length===1?'':'s'}</span>
      </div>
      {selectedTasks.length>0 && <p style={{fontSize:11.5, color:'var(--text-faint)', margin:'-8px 0 12px'}}>Agenda ordenada por hora · las tareas sin hora van al final</p>}
      {selectedTasks.length===0 ? (
        <div className="empty-state">Sin tareas programadas este día.</div>
      ) : (
        <div className="goal-tasklist" style={{maxHeight:'none'}}>
          {selectedTasks.map(t=>(
            <TaskRow key={t.id} task={t} tags={tags}
              checked={t.recurring ? !!(t.completions && t.completions[calSelected]) : undefined}
              onToggle={()=>handleToggle(t)} onEdit={()=>onEditTask(t)} hideDelete
              recurBadge={t.recurring ? daysLabel(t.recurring.days) : null}
              blocked={!t.recurring && isTaskBlocked(t, tasks)} blockReason={!t.recurring ? blockingTaskTitles(t, tasks).join(', ') : ''}/>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Weekly review view ---------------- */
function WeeklyReviewView({tasks, goalTitle, goalColor, onEditTask, onMoveTask, offset, setOffset}){
  const range = useMemo(()=>{
    const monday = startOfWeekDate(new Date());
    monday.setDate(monday.getDate()+offset*7);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return {start:isoOf(monday), end:isoOf(sunday), monday, sunday};
  }, [offset]);
  const label = `${range.monday.getDate()} ${MONTH_NAMES[range.monday.getMonth()].slice(0,3)} – ${range.sunday.getDate()} ${MONTH_NAMES[range.sunday.getMonth()].slice(0,3)}`;

  const relevant = tasks.filter(t=>!t.recurring && t.endDate && t.endDate<=range.end);
  const completed = relevant.filter(t=>t.status==='hecho' && t.endDate>=range.start);
  const pending = relevant.filter(t=>t.status!=='hecho').sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const total = completed.length + pending.length;
  const pct = total ? Math.round((completed.length/total)*100) : 0;

  return (
    <div className="fade-view">
      <div className="stats-nav" style={{justifyContent:'center', marginBottom:18}}>
        <button className="icon-btn" style={{width:32,height:32}} onClick={()=>setOffset(o=>o-1)} title="Semana anterior"><IconChevLeft size={15}/></button>
        <span className="stats-range-label" style={{minWidth:170}}>{label}</span>
        <button className="icon-btn" style={{width:32,height:32}} onClick={()=>setOffset(o=>o+1)} title="Semana siguiente"><IconChevRight size={15}/></button>
      </div>

      <div className="review-stat-bar">
        <ProgressRing percent={pct} size={56} stroke={6} color="#4ADE9E"/>
        <div>
          <div className="stat-label">Planeado vs. hecho</div>
          <div className="stat-value">{completed.length}/{total}</div>
          <div className="stat-sub">tareas completadas de las planeadas esta semana</div>
        </div>
      </div>

      <div className="section-title">
        <h2>Pendientes <span className="count">{pending.length}</span></h2>
        {pending.length>0 && (
          <button className="btn btn-ghost btn-sm" onClick={()=>pending.forEach(t=>onMoveTask(t))}>Mover todas +7 días</button>
        )}
      </div>
      {pending.length===0 ? (
        <div className="empty-state">Nada pendiente. Vas al día 🎉</div>
      ) : (
        pending.map(t=>{
          const overdue = t.endDate < todayISO();
          return (
            <div className="review-task-row" key={t.id}>
              <span className="prio-dot" style={{background:PRIORITY[t.priority].solid}}></span>
              <div style={{flex:1, minWidth:0, cursor:'pointer'}} onClick={()=>onEditTask(t)}>
                <div className="deadline-title">{t.title}</div>
                <div className="deadline-goal">{goalTitle(t.goalId)}{overdue ? ' · vencida' : ''}</div>
              </div>
              <button className="review-move-btn" onClick={()=>onMoveTask(t)}>
                <IconArrowRight size={12}/> +7 días
              </button>
            </div>
          );
        })
      )}

      <div className="section-title">
        <h2>Completadas <span className="count">{completed.length}</span></h2>
      </div>
      {completed.length===0 ? (
        <div className="empty-state">Nada completado todavía esta semana.</div>
      ) : (
        completed.map(t=>(
          <div className="review-task-row" key={t.id} style={{opacity:.6}}>
            <span className="prio-dot" style={{background:'var(--green)'}}></span>
            <div style={{flex:1, minWidth:0}}>
              <div className="deadline-title" style={{textDecoration:'line-through'}}>{t.title}</div>
              <div className="deadline-goal">{goalTitle(t.goalId)}</div>
            </div>
          </div>
        ))
      )}
    </div>
  );
}

/* ---------------- Tags manager ---------------- */
function TagsManager({tags, onAdd, onDelete}){
  const [name, setName] = useState('');
  const [color, setColor] = useState('violet');
  const submit = (e) => { e.preventDefault(); onAdd(name, color); setName(''); };
  return (
    <div className="card-like-chart" style={{marginTop:30}}>
      <div className="section-title" style={{margin:'0 0 12px'}}><h2>Etiquetas</h2></div>
      {tags.length===0 && <div style={{fontSize:12.5, color:'var(--text-faint)', marginBottom:10}}>Sin etiquetas todavía. Créalas para clasificar tareas de forma transversal a tus metas (ej. Trabajo, Personal, Salud).</div>}
      {tags.map(tg=>{
        const c = COLORS[tg.color]||COLORS.violet;
        return (
          <div className="tag-manage-row" key={tg.id}>
            <span className="tag-manage-dot" style={{background:c.solid}}></span>
            <span className="tag-manage-name">{tg.name}</span>
            <button className="task-del" onClick={()=>onDelete(tg.id)} title="Eliminar etiqueta"><IconX size={14}/></button>
          </div>
        );
      })}
      <form className="tag-add-row" onSubmit={submit}>
        <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Nueva etiqueta (ej. Trabajo)" />
        <select className="filter-select" style={{flex:'none', width:100}} value={color} onChange={e=>setColor(e.target.value)}>
          {Object.entries(COLORS).map(([key,c])=><option key={key} value={key}>{c.name}</option>)}
        </select>
        <button type="submit" className="btn btn-primary btn-sm"><IconPlus size={13}/></button>
      </form>
    </div>
  );
}

/* ---------------- Stats view ---------------- */
function StatsView({goals, allGoals, tasks, goalTitle, goalColor, period, setPeriod, offset, setOffset}){
  const [includeArchived, setIncludeArchived] = useState(false);
  const range = useMemo(()=>periodRange(period, offset), [period, offset]);
  const buckets = useMemo(()=>periodBuckets(period, range), [period, range]);
  const inRange = (iso) => iso && iso>=range.start && iso<=range.end;
  const shownGoals = includeArchived ? allGoals : goals;
  const shownGoalIds = new Set(shownGoals.map(g=>g.id));
  tasks = tasks.filter(t=>shownGoalIds.has(t.goalId));

  const completedNormal = tasks.filter(t=>!t.recurring && inRange(t.completedAt));
  const recurringDoneInRange = tasks.filter(t=>t.recurring && Object.keys(t.completions||{}).some(d=>t.completions[d] && inRange(d)));
  const completedCount = completedNormal.length + recurringCompletionDates(tasks, range.start, range.end).length;
  const created = tasks.filter(t=>inRange(t.createdAt));
  const values = buckets.map(b=>completedInBucket(tasks, b));
  const streak = currentStreak(tasks);

  const activeGoalIds = new Set([
    ...completedNormal.map(t=>t.goalId),
    ...recurringDoneInRange.map(t=>t.goalId),
    ...shownGoals.filter(g=>(g.metricLog||[]).some(e=>inRange(e.date))).map(g=>g.id)
  ]);

  return (
    <div className="fade-view">
      <div className="stats-toolbar">
        <div className="stats-period-tabs">
          {[['week','Semana'],['month','Mes'],['year','Año']].map(([key,label])=>(
            <button key={key} className={"stats-period-btn "+(period===key?'active':'')} onClick={()=>setPeriod(key)}>{label}</button>
          ))}
        </div>
        <div className="stats-nav">
          <button className="icon-btn" style={{width:32,height:32}} onClick={()=>setOffset(o=>o-1)} title="Periodo anterior"><IconChevLeft size={15}/></button>
          <span className="stats-range-label">{range.label}</span>
          <button className="icon-btn" style={{width:32,height:32}} onClick={()=>setOffset(o=>o+1)} title="Periodo siguiente"><IconChevRight size={15}/></button>
        </div>
        <label className="metric-toggle-row" style={{margin:0}}>
          <input type="checkbox" checked={includeArchived} onChange={()=>setIncludeArchived(v=>!v)} />
          <span>Incluir metas archivadas</span>
        </label>
      </div>

      <div className="stat-grid">
        <div className="stat-card" style={{'--accent-soft':'var(--amber-soft)'}}>
          <div className="stat-label">Racha activa</div>
          <div className="stat-value">{streak}</div>
          <div className="stat-sub">{streak===1?'día seguido':'días seguidos'} con tareas hechas</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--green-soft)'}}>
          <div className="stat-label">Completadas</div>
          <div className="stat-value">{completedCount}</div>
          <div className="stat-sub">en este periodo</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--blue-soft)'}}>
          <div className="stat-label">Creadas</div>
          <div className="stat-value">{created.length}</div>
          <div className="stat-sub">en este periodo</div>
        </div>
        <div className="stat-card" style={{'--accent-soft':'var(--violet-soft)'}}>
          <div className="stat-label">Metas con actividad</div>
          <div className="stat-value">{activeGoalIds.size}</div>
          <div className="stat-sub">de {shownGoals.length} metas totales</div>
        </div>
      </div>

      <div className="section-title">
        <h2>Tareas completadas por {period==='week'?'día':period==='month'?'día':'mes'}</h2>
      </div>
      <div className="card-like-chart">
        <BarChart buckets={buckets} values={values} color="#7C6CF6"/>
      </div>

      <div className="section-title">
        <h2>Por meta <span className="count">{shownGoals.length}</span></h2>
      </div>
      {shownGoals.length===0 ? (
        <div className="empty-state">Aún no tienes metas.</div>
      ) : (
        <div>
          {shownGoals.map(g=>{
            const color = (COLORS[g.color]||COLORS.violet).solid;
            const gRecurringTasks = tasks.filter(t=>t.recurring && t.goalId===g.id);
            const gCompleted = completedNormal.filter(t=>t.goalId===g.id).length + recurringCompletionDates(gRecurringTasks, range.start, range.end).length;
            const gCreated = created.filter(t=>t.goalId===g.id).length;
            const hasMetric = !!g.metric;
            const logInRange = hasMetric ? (g.metricLog||[]).filter(e=>inRange(e.date)).sort((a,b)=>a.date.localeCompare(b.date)) : [];
            return (
              <div className="stats-goal-row" key={g.id}>
                <span className="stats-goal-dot" style={{background:color}}></span>
                <span className="stats-goal-name">{g.title}</span>
                {hasMetric ? (
                  <span className="stats-goal-metric">
                    {logInRange.length>=2
                      ? `${logInRange[0].value} → ${logInRange[logInRange.length-1].value}${g.metric.unit?(' '+g.metric.unit):''}`
                      : logInRange.length===1
                        ? `${logInRange[0].value}${g.metric.unit?(' '+g.metric.unit):''} (1 registro)`
                        : 'sin registros este periodo'}
                  </span>
                ) : (
                  <span className="stats-goal-count">{gCompleted} hechas · {gCreated} creadas</span>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------- Goal modal ---------------- */
function GoalModal({goal, onClose, onSave}){
  const isNew = !goal.id;
  const [title, setTitle] = useState(goal.title || '');
  const [color, setColor] = useState(goal.color || 'violet');
  const [metricOn, setMetricOn] = useState(!!goal.metric);
  const [metricName, setMetricName] = useState(goal.metric?.name || '');
  const [metricUnit, setMetricUnit] = useState(goal.metric?.unit || '');
  const [metricTarget, setMetricTarget] = useState(goal.metric?.target ?? '');
  const submit = (e) => {
    e.preventDefault();
    if(!title.trim()) return;
    if(metricOn && !metricName.trim()) return;
    onSave({
      id: goal.id || 'g_'+uid(),
      title: title.trim(),
      color,
      createdAt: goal.createdAt || todayISO(),
      archived: false,
      metric: metricOn ? {
        name: metricName.trim(),
        unit: metricUnit.trim(),
        target: metricTarget===''? null : parseFloat(metricTarget)
      } : null,
      metricLog: metricOn ? (goal.metricLog || []) : [],
    });
  };
  return (
    <div className="modal-backdrop" onMouseDown={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <form className="modal" onSubmit={submit}>
        <h3>{isNew ? 'Nueva meta' : 'Editar meta'}</h3>
        <div className="field">
          <label>Título</label>
          <input type="text" autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder="Ej. Aprender React" />
        </div>
        <div className="field">
          <label>Color</label>
          <div className="swatches">
            {Object.entries(COLORS).map(([key,c])=>(
              <button type="button" key={key} className={"swatch "+(color===key?'selected':'')}
                style={{background:c.solid}} onClick={()=>setColor(key)} title={c.name}></button>
            ))}
          </div>
        </div>
        <div className="field metric-toggle-row" onClick={()=>setMetricOn(v=>!v)}>
          <input type="checkbox" checked={metricOn} onChange={()=>setMetricOn(v=>!v)} onClick={e=>e.stopPropagation()} />
          <span>Trackear con una métrica (peso, ahorro, km...) en vez de/además de tareas</span>
        </div>
        {metricOn && (
          <React.Fragment>
            <div className="field">
              <label>Nombre de la métrica</label>
              <input type="text" value={metricName} onChange={e=>setMetricName(e.target.value)} placeholder="Ej. Peso corporal" />
            </div>
            <div className="field" style={{display:'flex', gap:10}}>
              <div style={{flex:1}}>
                <label>Unidad (opcional)</label>
                <input type="text" value={metricUnit} onChange={e=>setMetricUnit(e.target.value)} placeholder="kg, km, €..." />
              </div>
              <div style={{flex:1}}>
                <label>Objetivo (opcional)</label>
                <input type="number" step="any" value={metricTarget} onChange={e=>setMetricTarget(e.target.value)} placeholder="70" />
              </div>
            </div>
          </React.Fragment>
        )}
        <div className="modal-actions">
          <button type="button" className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
          <button type="submit" className="btn btn-primary btn-sm">{isNew?'Crear meta':'Guardar cambios'}</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Task modal ---------------- */
function TaskModal({task, goals, tags, allTasks, onClose, onSave}){
  const isNew = !task.id;
  const [title, setTitle] = useState(task.title || '');
  const [goalId, setGoalId] = useState(task.goalId || (goals[0] && goals[0].id) || '');
  const [priority, setPriority] = useState(task.priority || 'media');
  const [status, setStatus] = useState(task.status || 'pendiente');
  const [startDate, setStartDate] = useState(task.startDate || todayISO());
  const [endDate, setEndDate] = useState(task.endDate || task.startDate || todayISO());
  const [recurringOn, setRecurringOn] = useState(!!task.recurring);
  const [recurDays, setRecurDays] = useState((task.recurring && task.recurring.days) || []);
  const [milestone, setMilestone] = useState(!!task.milestone);
  const [time, setTime] = useState(task.time || '');
  const [tagIds, setTagIds] = useState(task.tagIds || []);
  const [urgent, setUrgent] = useState(!!task.urgent);
  const [dependsOn, setDependsOn] = useState(task.dependsOn || []);
  const rangeError = !recurringOn && startDate && endDate && endDate < startDate;
  const depOptions = (allTasks||[]).filter(t=>t.goalId===goalId && t.id!==task.id && !t.recurring && !(t.dependsOn||[]).includes(task.id));

  const submit = (e) => {
    e.preventDefault();
    if(!title.trim() || !goalId) return;
    if(recurringOn && recurDays.length===0) return;
    if(!recurringOn && rangeError) return;
    onSave({
      id: task.id || 't_'+uid(),
      goalId, title: title.trim(), priority,
      status: recurringOn ? 'pendiente' : status,
      startDate: recurringOn ? null : (startDate || null),
      endDate: recurringOn ? null : (endDate || startDate || null),
      createdAt: task.createdAt || todayISO(),
      completedAt: recurringOn ? null : (status==='hecho' ? (task.completedAt || todayISO()) : null),
      recurring: recurringOn ? {days:[...recurDays].sort((a,b)=>a-b)} : null,
      milestone: recurringOn ? false : milestone,
      time: recurringOn ? null : (time || null),
      tagIds,
      urgent: recurringOn ? false : urgent,
      dependsOn: recurringOn ? [] : dependsOn,
      completions: task.completions || {},
      subtasks: task.subtasks || [],
      notes: task.notes || '',
    });
  };

  return (
    <div className="modal-backdrop" onMouseDown={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <form className="modal" onSubmit={submit}>
        <h3>{isNew ? 'Nueva tarea' : 'Editar tarea'}</h3>
        <div className="field">
          <label>Título</label>
          <input type="text" autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder="Ej. Terminar el informe" />
        </div>
        <div className="field">
          <label>Meta</label>
          <select value={goalId} onChange={e=>setGoalId(e.target.value)}>
            {goals.map(g=><option key={g.id} value={g.id}>{g.title}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Prioridad</label>
          <div className="prio-choice">
            {Object.entries(PRIORITY).map(([key,p])=>(
              <button type="button" key={key} className={"prio-btn "+(priority===key?'selected':'')}
                style={priority===key?{background:p.solid}:{}} onClick={()=>setPriority(key)}>{p.label}</button>
            ))}
          </div>
        </div>
        {tags && tags.length>0 && (
          <div className="field">
            <label>Etiquetas</label>
            <div className="tag-picker">
              {tags.map(tg=>{
                const c = COLORS[tg.color]||COLORS.violet;
                const active = tagIds.includes(tg.id);
                return (
                  <button type="button" key={tg.id} className={"tag-toggle "+(active?'active':'')}
                    style={active?{background:c.solid}:{}}
                    onClick={()=>setTagIds(prev=>prev.includes(tg.id)?prev.filter(x=>x!==tg.id):[...prev,tg.id])}>
                    {tg.name}
                  </button>
                );
              })}
            </div>
          </div>
        )}
        <div className="field metric-toggle-row" onClick={()=>setRecurringOn(v=>!v)}>
          <input type="checkbox" checked={recurringOn} onChange={()=>setRecurringOn(v=>!v)} onClick={e=>e.stopPropagation()} />
          <span>Tarea recurrente (se repite cada semana en los días que elijas)</span>
        </div>
        {recurringOn ? (
          <div className="field">
            <label>Días de repetición</label>
            <div className="day-picker">
              {DOW_NAMES.map((label,i)=>{
                const dayNum = i===6 ? 0 : i+1;
                const active = recurDays.includes(dayNum);
                return (
                  <button type="button" key={dayNum} className={"day-chip "+(active?'active':'')}
                    onClick={()=>setRecurDays(prev=>prev.includes(dayNum)?prev.filter(x=>x!==dayNum):[...prev,dayNum])}>
                    {label}
                  </button>
                );
              })}
            </div>
          </div>
        ) : (
          <React.Fragment>
            <div className="field">
              <label>Estado</label>
              <select value={status} onChange={e=>setStatus(e.target.value)}>
                {STATUS_COLS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
              </select>
            </div>
            <div className="field" style={{display:'flex', gap:10}}>
              <div style={{flex:1}}>
                <label>Empieza</label>
                <input type="date" value={startDate||''} onChange={e=>setStartDate(e.target.value)} />
              </div>
              <div style={{flex:1}}>
                <label>Acaba</label>
                <input type="date" value={endDate||''} onChange={e=>setEndDate(e.target.value)} />
              </div>
            </div>
            {rangeError && <div style={{color:'#FF6B7A', fontSize:12, marginTop:-8, marginBottom:12}}>La fecha de fin no puede ser antes de la de inicio.</div>}
            <div className="field">
              <label>Hora (opcional)</label>
              <input type="time" value={time} onChange={e=>setTime(e.target.value)} />
            </div>
            <div className="field metric-toggle-row" onClick={()=>setMilestone(v=>!v)}>
              <input type="checkbox" checked={milestone} onChange={()=>setMilestone(v=>!v)} onClick={e=>e.stopPropagation()} />
              <span>Marcar como hito <IconStar size={12} style={{color:'var(--amber)', verticalAlign:'-2px'}}/> (aparece destacado en Dashboard y Calendario)</span>
            </div>
            <div className="field metric-toggle-row" onClick={()=>setUrgent(v=>!v)}>
              <input type="checkbox" checked={urgent} onChange={()=>setUrgent(v=>!v)} onClick={e=>e.stopPropagation()} />
              <span>Marcar como urgente (la ubica en la Matriz de Eisenhower)</span>
            </div>
            <div className="field">
              <label>Depende de (bloqueada por)</label>
              {depOptions.length===0 ? (
                <div style={{fontSize:12, color:'var(--text-faint)'}}>No hay otras tareas en esta meta para elegir.</div>
              ) : (
                <div className="dep-picker">
                  {depOptions.map(t=>(
                    <label key={t.id}>
                      <input type="checkbox" checked={dependsOn.includes(t.id)}
                        onChange={()=>setDependsOn(prev=>prev.includes(t.id)?prev.filter(x=>x!==t.id):[...prev,t.id])} />
                      {t.title}
                    </label>
                  ))}
                </div>
              )}
            </div>
          </React.Fragment>
        )}
        <div className="modal-actions">
          <button type="button" className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
          <button type="submit" className="btn btn-primary btn-sm" disabled={rangeError || (recurringOn && recurDays.length===0)}>{isNew?'Crear tarea':'Guardar cambios'}</button>
        </div>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
